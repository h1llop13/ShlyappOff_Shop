<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Оформление заказа · ShlyapOff</title>
    <link rel="stylesheet" href="/css/storefront.css">
    <script src="/js/telegram-loader.js" defer></script>
    <script src="/js/storefront.js" defer></script>
</head>
<body data-bind-cart>
<header th:replace="~{fragments/store :: navigation('')}"></header>
<main class="shell">
    <a href="/cart" class="back-link" data-mini-back>← Корзина</a>
    <h1 class="page-title">Оформление заказа</h1>
    <div class="purchase-layout checkout-layout">
        <aside class="purchase-summary">
            <h2>Ваш заказ</h2>
            <div class="order-summary">
                <div th:each="item : ${cart.items}" class="summary-item">
                    <span class="item-name" th:text="${item.product.name}">Товар</span>
                    <span th:if="${item.productVariant != null}" class="item-name"
                          th:text="${item.productVariant.value}">Вариант</span>
                    <span class="item-details">
                            <span th:text="${item.quantity}">1</span> ×
                            <span th:text="${#numbers.formatDecimal(item.product.price, 1, 'WHITESPACE', 2, 'COMMA')}">0</span> ₽
                        </span>
                </div>
                <div class="total-row">
                    <span>Сумма товаров</span>
                    <span th:text="${#numbers.formatDecimal(total, 1, 'WHITESPACE', 2, 'COMMA')} + ' ₽'">0 ₽</span>
                </div>
            </div>
        </aside>
        <form th:action="@{/checkout}" method="post" th:object="${orderDto}" id="checkoutForm">
            <div th:if="${#fields.hasGlobalErrors()}" class="notice" role="alert">
                <div th:each="error : ${#fields.globalErrors()}" th:text="${error.defaultMessage}">Ошибка оформления заказа</div>
            </div>
            <div class="section">
                <h2 class="section-title">Контактные данные</h2>
                <div class="form-group">
                    <label class="form-label" for="customerName">Ваше имя *</label>
                    <input type="text" class="form-input" th:field="*{customerName}"
                           th:classappend="${#fields.hasErrors('customerName')} ? 'error'"
                           autocomplete="name" required>
                    <div th:if="${#fields.hasErrors('customerName')}" class="form-error">
                        <span th:errors="*{customerName}">Ошибка</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Телефон *</label>
                    <input type="tel" class="form-input" th:field="*{phone}"
                           th:classappend="${#fields.hasErrors('phone')} ? 'error'"
                           autocomplete="tel" placeholder="+7 (999) 123-45-67" required>
                    <div th:if="${#fields.hasErrors('phone')}" class="form-error">
                        <span th:errors="*{phone}">Ошибка</span>
                    </div>
                </div>
            </div>
            <div class="section">
                <h2 class="section-title">Способ получения *</h2>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" th:field="*{deliveryType}" value="Самовывоз" required>
                        <span>Самовывоз</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" th:field="*{deliveryType}" value="Доставка">
                        <span>Доставка</span>
                    </label>
                </div>
                <div th:if="${#fields.hasErrors('deliveryType')}" class="form-error">
                    <span th:errors="*{deliveryType}">Ошибка</span>
                </div>
            </div>
            <div class="section">
                <label class="section-title" for="comment">Комментарий</label>
                <div class="form-group">
                        <textarea class="form-textarea" th:field="*{comment}"
                                  th:classappend="${#fields.hasErrors('comment')} ? 'error'"
                                  placeholder="Дополнительные пожелания..."></textarea>
                    <div th:if="${#fields.hasErrors('comment')}" class="form-error">
                        <span th:errors="*{comment}">Ошибка</span>
                    </div>
                </div>
            </div>

            <div class="section" th:if="${bonusBalance != null && bonusBalance > 0}">
                <h2 class="section-title">Бонусы</h2>
                <label class="radio-option">
                    <input type="checkbox" th:field="*{useBonuses}">
                    <span>Списать доступные бонусы: <b th:text="${bonusBalance} + ' ₽'"></b></span>
                </label>
                <p class="field-hint">1 бонус = 1 ₽. Бонусы можно списать до суммы заказа.</p>
            </div>

            <details class="section" th:open="*{promoCode != null && !promoCode.isEmpty()}">
                <summary>Промокод</summary>
                <div class="form-group">
                    <input type="text" class="form-input" th:field="*{promoCode}"
                           maxlength="40" autocomplete="off" aria-label="Промокод" placeholder="Введите промокод">
                    <p class="field-hint">Скидка будет рассчитана при подтверждении заказа.</p>
                </div>
            </details>

            <input type="hidden" name="telegramInitData" id="telegramInitData">
            <div class="checkout-action">
                <button type="submit" class="button wide">Подтвердить заказ</button>
            </div>
        </form>
    </div>
</main>
<script src="/js/telegram-shop.js"></script>
</body>
</html>
