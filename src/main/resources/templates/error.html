<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка — ShlyapOff</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; background: Canvas; color: CanvasText; }
        main { width: min(520px, 100%); text-align: center; padding: 36px; border: 1px solid color-mix(in srgb, CanvasText 15%, transparent); border-radius: 22px; }
        .status { font-size: 64px; font-weight: 800; opacity: .2; margin: 0; }
        h1 { margin: 8px 0; } p { opacity: .72; line-height: 1.5; }
        a { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 12px; background: CanvasText; color: Canvas; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body><main><p class="status" th:text="${status ?: 500}">500</p><h1>Что-то пошло не так</h1><p th:text="${message ?: 'Попробуйте ещё раз позже.'}"></p><a href="/">На главную</a></main></body>
</html>
