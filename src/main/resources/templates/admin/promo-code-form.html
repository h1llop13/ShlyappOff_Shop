<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Админка — Промокод</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-dark text-white"><nav class="navbar navbar-dark bg-black"><div class="container"><a class="navbar-brand" href="/admin/promo-codes">← Промокоды</a></div></nav>
<main class="container mt-5" style="max-width:820px"><h1 th:text="${promoCode.id == null ? 'Новый промокод' : 'Редактирование промокода'}"></h1><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
<form method="post" class="mt-4" th:action="${promoCode.id == null ? '/admin/promo-codes/create' : '/admin/promo-codes/edit/' + promoCode.id}">
    <div class="row g-3">
        <div class="col-md-5"><label class="form-label">Код</label><input name="code" maxlength="40" required class="form-control text-uppercase" th:value="${promoCode.code}" placeholder="WELCOME10"></div>
        <div class="col-md-4"><label class="form-label">Тип скидки</label><select name="discountType" class="form-select"><option th:each="type : ${discountTypes}" th:value="${type}" th:text="${type.displayName}" th:selected="${type == promoCode.discountType}"></option></select></div>
        <div class="col-md-3"><label class="form-label">Значение</label><input name="discountValue" type="number" min="0.01" step="0.01" required class="form-control" th:value="${promoCode.discountValue}"></div>
        <div class="col-12"><label class="form-label">Описание</label><input name="description" maxlength="255" class="form-control" th:value="${promoCode.description}"></div>
        <div class="col-md-4"><label class="form-label">Минимальная сумма, ₽</label><input name="minOrderAmount" type="number" min="0" step="0.01" class="form-control" th:value="${promoCode.minOrderAmount}"></div>
        <div class="col-md-4"><label class="form-label">Максимальная скидка, ₽</label><input name="maxDiscountAmount" type="number" min="0.01" step="0.01" class="form-control" th:value="${promoCode.maxDiscountAmount}"></div>
        <div class="col-md-2"><label class="form-label">Общий лимит</label><input name="usageLimit" type="number" min="1" class="form-control" th:value="${promoCode.usageLimit}"></div>
        <div class="col-md-2"><label class="form-label">На клиента</label><input name="perCustomerLimit" type="number" min="1" class="form-control" th:value="${promoCode.perCustomerLimit}"></div>
        <div class="col-md-6"><label class="form-label">Начало</label><input name="startsAt" type="datetime-local" class="form-control" th:value="${promoCode.startsAt}"></div>
        <div class="col-md-6"><label class="form-label">Окончание</label><input name="endsAt" type="datetime-local" class="form-control" th:value="${promoCode.endsAt}"></div>
    </div>
    <div class="form-check form-switch mt-4"><input class="form-check-input" type="checkbox" name="active" value="true" id="active" th:checked="${promoCode.active}"><label class="form-check-label" for="active">Промокод активен</label></div>
    <div class="mt-4 d-flex gap-2"><button class="btn btn-warning">Сохранить</button><a class="btn btn-outline-light" href="/admin/promo-codes">Отмена</a></div>
</form></main></body></html>
