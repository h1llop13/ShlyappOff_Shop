<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${'Управление: ' + variantType.displayName + ' — ShlyapOff'}">Управление вариантами — ShlyapOff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">

<header th:replace="~{fragments/admin :: navigation('catalog')}"></header>

<div class="container mt-5">
    <div th:if="${successMessage}" class="alert alert-secondary admin-notice alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-secondary admin-notice alert-dismissible fade show">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h1 class="mb-4"><span th:text="${'Управление: ' + variantType.displayName}">Управление вариантами</span>: <span th:text="${product.name}">Товар</span></h1>

    <!-- Форма добавления вкуса -->
    <div class="card admin-surface mb-4">
        <div class="card-body">
            <h5 th:text="${'Добавить ' + variantType.singularAccusative}">Добавить вариант</h5>
            <form th:action="@{/admin/product/{id}/variant/add(id=${product.id})}" method="post" class="row g-3">
                <div class="col-md-6">
                    <input type="text" name="value" class="form-control"
                           th:placeholder="${'Укажите ' + variantType.singularAccusative}" required>
                </div>
                <div class="col-md-3">
                    <input type="number" min="0" name="stockQuantity" value="0" class="form-control" aria-label="Остаток">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-dark w-100">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Список вкусов -->
    <div class="card admin-surface">
        <div class="card-body">
            <h5>Добавленные варианты</h5>
            <div th:if="${#lists.isEmpty(variants)}" class="alert alert-info">
                Пока нет добавленных вариантов
            </div>
            <div th:if="${!#lists.isEmpty(variants)}" class="list-group">
                <div th:each="variant : ${variants}" class="list-group-item d-flex justify-content-between flex-wrap gap-2 align-items-center">
                    <div>
                        <span th:if="${variant.stockQuantity > 0}" class="text-body me-2">✓</span>
                        <span th:if="${variant.stockQuantity == 0}" class="text-body me-2">✗</span>
                        <span th:text="${variant.value}">Вариант</span>
                        <span class="badge text-bg-secondary ms-2" th:text="${variant.stockQuantity} + ' шт.'">0 шт.</span>
                        <span th:if="${variant.stockQuantity == 0}" class="badge text-bg-secondary ms-2">Нет в наличии</span>
                    </div>
                    <div class="d-flex gap-2">
                        <form th:action="@{/admin/product/variant/{id}/stock(id=${variant.id})}" method="post" class="d-flex gap-2">
                            <input type="number" min="0" name="stockQuantity" th:value="${variant.stockQuantity}"
                                   class="form-control form-control-sm" style="width: 90px;">
                            <button type="submit" class="btn btn-sm btn-outline-dark">Сохранить</button>
                        </form>
                        <form th:action="@{/admin/product/variant/{id}/delete(id=${variant.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-dark admin-delete"
                                    onclick="return confirm('Удалить этот вариант?')">Удалить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/admin/category/{categoryId}/products(categoryId=${product.category.id})}" class="btn btn-outline-dark">← Назад к товарам категории</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
