<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админка - Бренды</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">

<header th:replace="~{fragments/admin :: navigation('brands')}"></header>

<div class="container mt-5">
    <div th:if="${successMessage}" class="alert alert-secondary admin-notice alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between flex-wrap gap-2 align-items-center mb-4">
        <h1>Управление брендами</h1>
        <a href="/admin/brand/create" class="btn btn-dark">Добавить бренд</a>
    </div>

    <div class="table-responsive"><table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="brand : ${brands}">
            <td th:text="${brand.id}">1</td>
            <td th:text="${brand.name}">Бренд</td>
            <td>
                <a th:href="@{/admin/brand/edit/{id}(id=${brand.id})}" class="btn btn-sm btn-outline-dark">Редактировать</a>
                <form th:action="@{/admin/brand/delete/{id}(id=${brand.id})}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-sm btn-outline-dark admin-delete" onclick="return confirm('Удалить бренд?')">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
