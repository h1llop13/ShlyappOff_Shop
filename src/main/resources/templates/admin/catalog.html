<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — Каталог</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">

<header th:replace="~{fragments/admin :: navigation('catalog')}"></header>

<main class="container mt-5">
    <div th:if="${successMessage}" class="alert alert-secondary admin-notice alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}">Сообщение</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
    </div>

    <div class="d-flex justify-content-between flex-wrap gap-2 align-items-center mb-4">
        <div>
            <h1 class="mb-1">Каталог по категориям</h1>
            <p class="text-body-secondary mb-0">Выберите категорию, чтобы работать только с её товарами.</p>
        </div>
        <a href="/admin/categories" class="btn btn-outline-dark">Настроить категории</a>
    </div>

    <div th:if="${#lists.isEmpty(categories)}" class="alert alert-secondary">
        В каталоге пока нет категорий. <a href="/admin/category/create" class="alert-link">Создайте первую категорию</a>.
    </div>

    <div class="row g-4" th:unless="${#lists.isEmpty(categories)}">
        <div class="col-md-6 col-xl-4" th:each="category : ${categories}">
            <section class="card h-100 admin-surface border-secondary">
                <div class="card-body d-flex flex-column">
                    <h2 class="h4 card-title" th:text="${category.name}">Категория</h2>
                    <p class="text-body-secondary mb-2">
                        Товаров: <span th:text="${productCounts[category.id] ?: 0}">0</span>
                    </p>
                    <p class="text-body-secondary mb-4">
                        Варианты: <span th:text="${category.variantType.displayName}">Без вариантов</span>
                    </p>
                    <div class="d-flex gap-2 mt-auto">
                        <a th:href="@{/admin/category/{categoryId}/products(categoryId=${category.id})}" class="btn btn-outline-dark">Открыть товары</a>
                        <a th:href="@{/admin/product/create(categoryId=${category.id})}" class="btn btn-dark">Добавить</a>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
