<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Админка — Промокоды</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">
<header th:replace="~{fragments/admin :: navigation('promo-codes')}"></header>
<main class="container mt-5">
    <div th:if="${successMessage}" class="alert alert-secondary admin-notice" th:text="${successMessage}"></div>
    <div class="d-flex justify-content-between flex-wrap gap-2 align-items-center"><div><h1>Промокоды</h1><p class="text-body-secondary">Скидки, сроки и лимиты использования.</p></div><a href="/admin/promo-codes/create" class="btn btn-dark">Создать промокод</a></div>
    <div class="table-responsive mt-4"><table class="table table-striped align-middle"><thead><tr><th>Код</th><th>Скидка</th><th>Минимум</th><th>Лимиты</th><th>Период</th><th>Статус</th><th></th></tr></thead><tbody>
    <tr th:each="promo : ${promoCodes}">
        <td><code class="text-body fw-bold" th:text="${promo.code}">CODE</code><div class="small text-body-secondary" th:text="${promo.description}"></div></td>
        <td><span th:text="${promo.discountValue}"></span><span th:text="${promo.discountType.name() == 'PERCENTAGE' ? '%' : ' ₽'}"></span></td>
        <td th:text="${promo.minOrderAmount} + ' ₽'"></td>
        <td class="small"><div th:text="${promo.usageLimit == null ? 'Общий: без лимита' : 'Общий: ' + promo.usageLimit}"></div><div th:text="${promo.perCustomerLimit == null ? 'На клиента: без лимита' : 'На клиента: ' + promo.perCustomerLimit}"></div></td>
        <td class="small"><span th:text="${promo.startsAt ?: 'сразу'}"></span> — <span th:text="${promo.endsAt ?: 'без срока'}"></span></td>
        <td><span class="badge" th:classappend="${promo.active} ? ' text-bg-dark' : ' text-bg-secondary'" th:text="${promo.active} ? 'Активен' : 'Отключён'"></span></td>
        <td class="text-end"><a class="btn btn-sm btn-outline-dark" th:href="@{/admin/promo-codes/edit/{id}(id=${promo.id})}">Изменить</a> <form class="d-inline" method="post" th:action="@{/admin/promo-codes/delete/{id}(id=${promo.id})}"><button class="btn btn-sm btn-outline-dark admin-delete" onclick="return confirm('Удалить промокод?')">Удалить</button></form></td>
    </tr>
    <tr th:if="${promoCodes.isEmpty()}"><td colspan="7" class="text-center text-body-secondary py-5">Промокодов пока нет.</td></tr>
    </tbody></table></div>
</main></body></html>
