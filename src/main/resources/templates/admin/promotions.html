<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админка — Акции</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
<nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin">Админка ShlyapOff</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/admin">Товары</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/loyalty">Лояльность</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/promotions">Акции</a></li>
                <li class="nav-item"><a class="nav-link" href="/">На сайт</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container mt-5">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="mb-1">Акции</h1>
            <p class="text-white-50 mb-0">Сначала создайте кампанию. Товары и её отображение для покупателей добавим следующим этапом.</p>
        </div>
        <a href="/admin/promotions/create" class="btn btn-warning">Создать акцию</a>
    </div>

    <div class="table-responsive mt-4">
        <table class="table table-dark table-striped align-middle">
            <thead><tr><th>Акция</th><th>Тип</th><th>Период</th><th>Приоритет</th><th>Статус</th><th></th></tr></thead>
            <tbody>
            <tr th:each="promotion : ${promotions}">
                <td><b th:text="${promotion.title}">Акция</b><div class="small text-white-50" th:text="${promotion.description}"></div></td>
                <td th:text="${promotion.kind.displayName}">Подборка товаров</td>
                <td class="small"><span th:text="${promotion.startsAt ?: 'сразу'}"></span><span> — </span><span th:text="${promotion.endsAt ?: 'без срока'}"></span></td>
                <td th:text="${promotion.displayPriority}">0</td>
                <td><span class="badge" th:classappend="${promotion.active} ? ' bg-success' : ' bg-secondary'" th:text="${promotion.active} ? 'Активна' : 'Черновик'"></span></td>
                <td class="text-end"><a th:href="@{/admin/promotions/edit/{id}(id=${promotion.id})}" class="btn btn-sm btn-outline-light">Изменить</a>
                    <form th:action="@{/admin/promotions/delete/{id}(id=${promotion.id})}" method="post" class="d-inline"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Удалить акцию?')">Удалить</button></form></td>
            </tr>
            <tr th:if="${promotions.isEmpty()}"><td colspan="6" class="text-center text-white-50 py-5">Акций ещё нет.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
