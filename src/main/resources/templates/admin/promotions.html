<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админка — Акции</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">
<header th:replace="~{fragments/admin :: navigation('promotions')}"></header>

<main class="container mt-5">
    <div th:if="${successMessage}" class="alert alert-secondary admin-notice" th:text="${successMessage}"></div>
    <div class="d-flex justify-content-between flex-wrap gap-2 align-items-center mb-3">
        <div>
            <h1 class="mb-1">Акции</h1>
            <p class="text-body-secondary mb-0">Сначала создайте кампанию. Товары и её отображение для покупателей добавим следующим этапом.</p>
        </div>
        <a href="/admin/promotions/create" class="btn btn-dark">Создать акцию</a>
    </div>

    <div class="table-responsive mt-4">
        <table class="table table-striped align-middle">
            <thead><tr><th>Акция</th><th>Тип</th><th>Период</th><th>Приоритет</th><th>Статус</th><th></th></tr></thead>
            <tbody>
            <tr th:each="promotion : ${promotions}">
                <td><b th:text="${promotion.title}">Акция</b><div class="small text-body-secondary" th:text="${promotion.description}"></div></td>
                <td th:text="${promotion.kind.displayName}">Подборка товаров</td>
                <td class="small"><span th:text="${promotion.startsAt ?: 'сразу'}"></span><span> — </span><span th:text="${promotion.endsAt ?: 'без срока'}"></span></td>
                <td th:text="${promotion.displayPriority}">0</td>
                <td><span class="badge" th:classappend="${promotion.active} ? ' text-bg-dark' : ' text-bg-secondary'" th:text="${promotion.active} ? 'Активна' : 'Черновик'"></span></td>
                <td class="text-end"><a th:href="@{/admin/promotions/edit/{id}(id=${promotion.id})}" class="btn btn-sm btn-outline-dark">Изменить</a>
                    <form th:action="@{/admin/promotions/delete/{id}(id=${promotion.id})}" method="post" class="d-inline"><button class="btn btn-sm btn-outline-dark admin-delete" onclick="return confirm('Удалить акцию?')">Удалить</button></form></td>
            </tr>
            <tr th:if="${promotions.isEmpty()}"><td colspan="6" class="text-center text-body-secondary py-5">Акций ещё нет.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
