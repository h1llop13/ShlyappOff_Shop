<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.id != null ? 'Редактировать товар' : 'Добавить товар'}">Форма товара</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin">Админка ShlyapOff</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/admin">Каталог</a></li>
                <li class="nav-item"><a class="nav-link" href="/">На сайт</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container mt-5">
    <nav aria-label="Навигация" class="mb-3">
        <a href="/admin" class="link-light text-decoration-none">Каталог</a>
        <span class="text-white-50 mx-2">/</span>
        <a th:href="@{/admin/category/{categoryId}/products(categoryId=${category.id})}" class="link-light text-decoration-none" th:text="${category.name}">Категория</a>
        <span class="text-white-50 mx-2">/</span>
        <span th:text="${product.id != null ? 'Редактирование' : 'Новый товар'}">Товар</span>
    </nav>

    <h1 class="mb-2" th:text="${product.id != null ? 'Редактировать товар' : 'Добавить товар'}">Форма товара</h1>
    <p class="text-white-50 mb-4">Категория: <strong class="text-white" th:text="${category.name}">Категория</strong></p>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="${product.id != null ? '/admin/product/edit/' + product.id : '/admin/product/create'}"
          method="post"
          enctype="multipart/form-data">
        <input type="hidden" name="category_id" th:value="${category.id}">

        <div class="mb-3">
            <label for="name" class="form-label">Название товара</label>
            <input type="text" class="form-control bg-dark text-white" id="name" name="name" th:value="${product.name}" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Описание</label>
            <textarea class="form-control bg-dark text-white" id="description" name="description" rows="3" th:text="${product.description}"></textarea>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="price" class="form-label">Цена (₽)</label>
                <input type="number" step="0.01" min="0" class="form-control bg-dark text-white" id="price" name="price" th:value="${product.price}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="brand_id" class="form-label">Бренд</label>
                <select class="form-select bg-dark text-white" id="brand_id" name="brand_id" required>
                    <option value="">Выберите бренд</option>
                    <option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.name}"
                            th:selected="${product.brand != null && product.brand.id == brand.id}">Бренд</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div th:each="field : ${fields}" class="col-md-4 mb-3">
                <label th:for="${field.propertyName}" class="form-label" th:text="${field.displayName}">Характеристика</label>
                <input type="text" class="form-control bg-dark text-white"
                       th:id="${field.propertyName}" th:name="${field.propertyName}"
                       th:value="${field.getValue(product)}" th:placeholder="${field.placeholder}" required>
            </div>
        </div>

        <div th:if="${category.variantType.name() == 'NONE'}" class="mb-3">
            <label for="stockQuantity" class="form-label">Остаток на складе (шт.)</label>
            <input type="number" min="0" class="form-control bg-dark text-white" id="stockQuantity" name="stockQuantity" th:value="${product.stockQuantity}" required>
        </div>

        <section th:if="${product.id == null && category.variantType.name() != 'NONE'}" class="card bg-black mb-3">
            <div class="card-body">
                <h2 class="h5 mb-3" th:text="${category.variantType.displayTitle}">Варианты</h2>
                <div id="variantRows" class="d-grid gap-2"></div>
                <button type="button" id="addVariantButton" class="btn btn-outline-info mt-3"
                        th:text="${'Добавить ' + category.variantType.singularAccusative}">Добавить вариант</button>
            </div>
        </section>

        <div th:if="${product.id != null && category.variantType.name() != 'NONE'}" class="mb-3">
            <a th:href="@{/admin/product/{id}/variants(id=${product.id})}" class="btn btn-outline-info">Управлять вариантами товара</a>
        </div>

        <div class="mb-3">
            <label for="imageFile" class="form-label">Изображение товара</label>
            <input type="file" class="form-control bg-dark text-white" id="imageFile" name="imageFile" accept="image/*">
            <div th:if="${product.imageUrl != null}" class="mt-2">
                <small class="text-white-50">Текущее изображение:</small>
                <img th:src="${product.imageUrl}" alt="Текущее изображение" class="img-thumbnail mt-2" style="max-width: 200px;">
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning" th:text="${product.id != null ? 'Сохранить изменения' : 'Добавить товар'}">Сохранить</button>
            <a th:href="@{/admin/category/{categoryId}/products(categoryId=${category.id})}" class="btn btn-outline-light">Отмена</a>
        </div>
    </form>
</main>

<script th:if="${product.id == null && category.variantType.name() != 'NONE'}" th:inline="javascript">
    const variantRows = document.getElementById('variantRows');
    const addVariantButton = document.getElementById('addVariantButton');
    const singular = /*[[${category.variantType.singularAccusative}]]*/ 'вариант';

    function addVariantRow() {
        const row = document.createElement('div');
        row.className = 'input-group';
        row.innerHTML = `<input type="text" name="variantValues" class="form-control bg-dark text-white" placeholder="Укажите ${singular}" required>
                         <input type="number" min="0" name="variantStockQuantities" value="0" class="form-control bg-dark text-white" aria-label="Остаток" required>
                         <button type="button" class="btn btn-outline-danger">Удалить</button>`;
        row.querySelector('button').addEventListener('click', () => row.remove());
        variantRows.appendChild(row);
    }

    addVariantButton.addEventListener('click', addVariantRow);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
