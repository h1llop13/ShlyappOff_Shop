<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'Админка — ' + category.name}">Админка — Товары</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin">Админка ShlyapOff</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="/admin">Каталог</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/categories">Категории</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/brands">Бренды</a></li>
                <li class="nav-item"><a class="nav-link" href="/">На сайт</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container mt-5">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}">Сообщение</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <nav aria-label="Навигация" class="mb-3">
        <a href="/admin" class="link-light text-decoration-none">Каталог</a>
        <span class="text-white-50 mx-2">/</span>
        <span th:text="${category.name}">Категория</span>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1" th:text="${category.name}">Категория</h1>
            <p class="text-white-50 mb-0">Товары этой категории</p>
        </div>
        <a th:href="@{/admin/product/create(categoryId=${category.id})}" class="btn btn-warning">Добавить товар</a>
    </div>

    <div th:if="${#lists.isEmpty(products)}" class="alert alert-secondary">
        В этой категории ещё нет товаров.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(products)}">
        <table class="table table-dark table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Варианты</th>
                <th>Остаток</th>
                <th>Цена</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">1</td>
                <td th:text="${product.name}">Товар</td>
                <td>
                    <a th:if="${product.category != null && product.category.variantType.name() != 'NONE'}"
                       th:href="@{/admin/product/{id}/variants(id=${product.id})}" class="btn btn-sm btn-outline-info">Управлять</a>
                    <span th:unless="${product.category != null && product.category.variantType.name() != 'NONE'}">—</span>
                </td>
                <td th:if="${product.category == null || product.category.variantType == null || product.category.variantType.name() == 'NONE'}"
                    th:text="${product.stockQuantity} + ' шт.'">0 шт.</td>
                <td th:unless="${product.category == null || product.category.variantType == null || product.category.variantType.name() == 'NONE'}">По вариантам</td>
                <td th:text="${product.price} + ' ₽'">0 ₽</td>
                <td class="text-nowrap">
                    <a th:href="@{/admin/product/edit/{id}(id=${product.id})}" class="btn btn-sm btn-outline-light">Редактировать</a>
                    <form th:action="@{/admin/product/delete/{id}(id=${product.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Снять товар с продажи?')">Снять с продажи</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${totalPages > 1}" class="d-flex gap-2">
        <a th:if="${currentPage > 0}" th:href="@{/admin/category/{categoryId}/products(categoryId=${category.id},page=${currentPage - 1})}" class="btn btn-outline-light">Назад</a>
        <span class="align-self-center" th:text="${currentPage + 1 + ' / ' + totalPages}">1 / 1</span>
        <a th:if="${currentPage < totalPages - 1}" th:href="@{/admin/category/{categoryId}/products(categoryId=${category.id},page=${currentPage + 1})}" class="btn btn-outline-light">Вперёд</a>
    </nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
