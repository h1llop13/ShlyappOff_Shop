<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма бренда</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">

<header th:replace="~{fragments/admin :: navigation('brands')}"></header>

<div class="container mt-5">
    <h1 th:text="${brand.id != null ? 'Редактировать бренд' : 'Добавить бренд'}">Форма</h1>

    <form th:action="${brand.id != null ? '/admin/brand/edit/' + brand.id : '/admin/brand/create'}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">Название бренда</label>
            <input type="text" class="form-control" id="name" name="name"
                   th:value="${brand.name}" required>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-dark">Сохранить</button>
            <a href="/admin/brands" class="btn btn-outline-dark">Отмена</a>
        </div>
    </form>
</div>

</body>
</html>
