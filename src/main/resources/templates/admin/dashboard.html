<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дашборд продаж — ShlyapOff</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><style>.metric{background:#111;border:1px solid #343a40;border-radius:16px}.chart-row{display:grid;grid-template-columns:92px 1fr 110px;gap:12px;align-items:center}.bar{height:12px;background:#ffc107;border-radius:99px;min-width:2%}</style></head>
<body class="bg-dark text-white"><nav class="navbar navbar-expand navbar-dark bg-black sticky-top"><div class="container"><a class="navbar-brand fw-bold" href="/admin">Админка ShlyapOff</a><div class="navbar-nav"><a class="nav-link active" href="/admin/dashboard">Дашборд</a><a class="nav-link" href="/admin/orders">Заказы</a><a class="nav-link" href="/admin/promo-codes">Промокоды</a><a class="nav-link" href="/admin/promotions">Акции</a></div></div></nav>
<main class="container py-5"><div class="d-flex justify-content-between align-items-end mb-4"><div><h1>Продажи</h1><p class="text-white-50 mb-0">Показатели по выполненным заказам за последние 30 дней.</p></div><span class="badge bg-warning text-dark" th:text="${dashboard.newOrders + dashboard.processingOrders} + ' активных заказов'"></span></div>
<div class="row g-3"><div class="col-md-3"><section class="metric p-4"><div class="text-white-50">Сегодня</div><div class="h3 mb-0" th:text="${dashboard.todayRevenue} + ' ₽'"></div></section></div><div class="col-md-3"><section class="metric p-4"><div class="text-white-50">За 30 дней</div><div class="h3 mb-0" th:text="${dashboard.periodRevenue} + ' ₽'"></div></section></div><div class="col-md-3"><section class="metric p-4"><div class="text-white-50">Заказов</div><div class="h3 mb-0" th:text="${dashboard.periodOrders}"></div></section></div><div class="col-md-3"><section class="metric p-4"><div class="text-white-50">Средний чек</div><div class="h3 mb-0" th:text="${dashboard.averageOrder} + ' ₽'"></div></section></div></div>
<div class="row g-4 mt-2"><div class="col-lg-8"><section class="metric p-4"><h2 class="h5 mb-4">Динамика за 14 дней</h2><div class="d-grid gap-3"><div class="chart-row" th:each="day : ${dashboard.dailySales}"><span class="small text-white-50" th:text="${#temporals.format(day.date, 'dd.MM')}"></span><div class="bar" th:style="${'width:' + day.widthPercent + '%'}"></div><span class="text-end small" th:text="${day.revenue} + ' ₽'"></span></div></div></section></div>
<div class="col-lg-4"><section class="metric p-4 h-100"><h2 class="h5 mb-4">Топ товаров</h2><div th:each="product : ${dashboard.topProducts}" class="border-bottom border-secondary py-3"><div class="fw-semibold" th:text="${product.name}"></div><div class="small text-white-50"><span th:text="${product.quantity} + ' шт.'"></span> · <span th:text="${product.revenue} + ' ₽'"></span></div></div><p th:if="${dashboard.topProducts.isEmpty()}" class="text-white-50">Пока нет выполненных заказов.</p></section></div></div></main></body></html>
