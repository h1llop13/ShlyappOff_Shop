<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админка - Клиенты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">

<header th:replace="~{fragments/admin :: navigation('customers')}"></header>

<div class="container mt-5">
    <h1 class="mb-4">Клиенты Mini App</h1>

    <div class="table-responsive"><table class="table table-striped">
        <thead>
        <tr>
            <th>Telegram</th>
            <th>Имя</th>
            <th>Сумма всех заказов</th>
            <th>Бонусы</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="customer : ${customers}">
            <td>
                <a th:if="${customer.telegramUsername}" th:href="'https://t.me/' + ${customer.telegramUsername}"
                   th:text="'@' + ${customer.telegramUsername}" target="_blank" class="link-dark"></a>
                <span th:unless="${customer.telegramUsername}" th:text="'ID ' + ${customer.telegramUserId}"></span>
            </td>
            <td th:text="(${customer.firstName} ?: '') + ' ' + (${customer.lastName} ?: '')">Имя</td>
            <td th:text="${customer.totalSpent} + ' ₽'">0 ₽</td>
            <td>
                <span class="badge text-bg-dark" th:text="${customer.bonusBalance} + ' бонусов'"></span>
            </td>
        </tr>
        <tr th:if="${customers.isEmpty()}">
            <td colspan="4" class="text-body-secondary">Пока ни один клиент не оформил заказ через Mini App.</td>
        </tr>
        </tbody>
    </table></div>
    <nav th:if="${totalPages > 1}" class="d-flex gap-2">
        <a th:if="${currentPage > 0}" th:href="@{/admin/customers(page=${currentPage - 1})}" class="btn btn-outline-dark">Назад</a>
        <span class="align-self-center" th:text="${currentPage + 1 + ' / ' + totalPages}">1 / 1</span>
        <a th:if="${currentPage < totalPages - 1}" th:href="@{/admin/customers(page=${currentPage + 1})}" class="btn btn-outline-dark">Вперёд</a>
    </nav>
</div>

</body>
</html>
