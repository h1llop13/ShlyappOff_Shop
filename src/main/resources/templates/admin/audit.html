<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал действий — ShlyapOff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
<nav class="navbar navbar-dark bg-black">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin">Админка ShlyapOff</a>
        <a class="btn btn-outline-light" href="/admin/dashboard">Дашборд</a>
    </div>
</nav>
<main class="container py-5">
    <h1 class="mb-4">Журнал действий администраторов</h1>
    <div class="table-responsive">
        <table class="table table-dark table-striped align-middle">
            <thead><tr><th>Время</th><th>Администратор</th><th>Действие</th><th>Объект</th><th>Поле</th><th>Было</th><th>Стало</th></tr></thead>
            <tbody>
            <tr th:each="entry : ${entries}">
                <td th:text="${#temporals.format(entry.createdAt, 'dd.MM.yyyy HH:mm:ss')}"></td>
                <td th:text="${entry.actorUsername}"></td>
                <td th:text="${entry.action}"></td>
                <td th:text="${entry.entityType + ' #' + entry.entityId}"></td>
                <td th:text="${entry.fieldName}"></td>
                <td th:text="${entry.oldValue}"></td>
                <td th:text="${entry.newValue}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(entries)}"><td colspan="7" class="text-center text-white-50">Записей пока нет</td></tr>
            </tbody>
        </table>
    </div>
    <nav th:if="${totalPages > 1}" class="d-flex gap-2">
        <a th:if="${currentPage > 0}" th:href="@{/admin/audit(page=${currentPage - 1})}" class="btn btn-outline-light">Назад</a>
        <span class="align-self-center" th:text="${currentPage + 1 + ' / ' + totalPages}"></span>
        <a th:if="${currentPage < totalPages - 1}" th:href="@{/admin/audit(page=${currentPage + 1})}" class="btn btn-outline-light">Вперёд</a>
    </nav>
</main>
</body>
</html>
