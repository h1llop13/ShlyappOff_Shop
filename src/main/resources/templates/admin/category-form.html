<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма категории</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">

<header th:replace="~{fragments/admin :: navigation('categories')}"></header>

<div class="container mt-5">
    <h1 th:text="${category.id != null ? 'Редактировать категорию' : 'Добавить категорию'}">Форма</h1>

    <form th:action="${category.id != null ? '/admin/category/edit/' + category.id : '/admin/category/create'}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">Название категории</label>
            <input type="text" class="form-control" id="name" name="name"
                   th:value="${category.name}" required>
        </div>
        <div class="mb-3">
            <label for="variantType" class="form-label">Тип вариантов товара</label>
            <select class="form-select" id="variantType" name="variantType" required>
                <option th:each="variantType : ${variantTypes}"
                        th:value="${variantType}"
                        th:text="${variantType.displayName}"
                        th:selected="${category.variantType == variantType}">
                </option>
            </select>
            <div class="form-text text-body-secondary">Определяет, что указывается для товаров этой категории.</div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-dark">Сохранить</button>
            <a href="/admin/categories" class="btn btn-outline-dark">Отмена</a>
        </div>
    </form>
</div>

</body>
</html>
