<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Магазин · ShlyapOff</title>
    <link rel="stylesheet" href="/css/storefront.css">
    <script src="/js/telegram-loader.js" defer></script>
    <script src="/js/storefront.js" defer></script>
</head>
<body>
<header th:replace="~{fragments/store :: navigation('home')}"></header>
<main class="shell">
    <section class="hero">
        <h1>ShlyapOff.</h1>
        <form action="/catalog" method="get" class="search-row" role="search" aria-label="Поиск по магазину">
            <input type="search" name="search" aria-label="Название товара" placeholder="Что ищете?">
            <button class="button inverse" type="submit">Найти</button>
        </form>
        <a href="/catalog" class="hero-link">Смотреть каталог <span aria-hidden="true">→</span></a>
    </section>
    <section class="store-section" th:unless="${#lists.isEmpty(categories)}">
        <h2>Категории</h2>
        <div class="category-list">
            <a th:each="category : ${categories}" th:href="@{/catalog(categoryId=${category.id})}"
               th:text="${category.name}" class="button secondary">Категория</a>
        </div>
    </section>
    <section class="store-section">
        <div class="section-header">
            <h2>Новинки</h2>
            <a href="/catalog">Все товары <span aria-hidden="true">→</span></a>
        </div>
        <p th:if="${#lists.isEmpty(products)}" class="empty-state">Товаров пока нет.</p>
        <div class="products-grid" th:unless="${#lists.isEmpty(products)}">
        <th:block th:each="product : ${products}">
            <article th:replace="~{fragments/store :: productCard(${product})}"></article>
        </th:block>
    </div>
    </section>
</main>
<script src="/js/telegram-shop.js"></script>
<script src="/js/cart-feedback.js"></script>
</body>
</html>
