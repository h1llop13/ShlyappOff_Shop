<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Товар · ShlyapOff</title>
    <link rel="stylesheet" href="/css/storefront.css">
    <script src="/js/telegram-loader.js" defer></script>
    <script src="/js/storefront.js" defer></script>
</head>
<body>
<header th:replace="~{fragments/store :: navigation('')}"></header>
<main class="shell">
    <a href="/catalog" class="back-link" data-mini-back>← Каталог</a>
    <section class="product-layout">
        <div class="product-image-container">
            <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" class="product-image" th:alt="${product.name}">
            <img th:if="${product.imageUrl == null}" src="/img/placeholder.svg" class="product-image" alt="Нет фотографии товара">
        </div>
        <div class="product-detail">
            <h1 class="product-name" th:text="${product.name}">Название товара</h1>
            <p class="price-tag" th:text="${#numbers.formatDecimal(product.price, 1, 'WHITESPACE', 2, 'COMMA')} + ' ₽'">0 ₽</p>
            <p class="product-desc" th:text="${product.description}">Описание товара...</p>
            <p th:if="${!requiresVariant}" class="stock-status"
               th:classappend="${product.stockQuantity > 0} ? '' : ' out-of-stock'"
               th:text="${product.stockQuantity > 0} ? 'В наличии: ' + product.stockQuantity + ' шт.' : 'Нет в наличии'">В наличии: 0 шт.</p>

            <p th:if="${errorMessage}" class="notice" role="alert" th:text="${errorMessage}"></p>

            <div th:if="${variants != null && !variants.isEmpty()}">
                <h2 class="section-title" th:text="${product.category != null ? product.category.variantType.displayTitle : 'Варианты'}">Варианты</h2>
                <div class="variants-grid">
                    <label th:each="variant : ${variants}"
                         th:class="${variant.stockQuantity > 0} ? 'variant-chip in-stock' : 'variant-chip out-of-stock'">
                        <input th:if="${requiresVariant}" type="radio" name="variantId" th:value="${variant.id}"
                               form="addToCartForm" th:disabled="${variant.stockQuantity <= 0}" required>
                        <span th:text="${variant.value}">Вариант</span>
                        <span th:text="${'· ' + variant.stockQuantity + ' шт.'}">· 0 шт.</span>
                    </label>
                </div>
            </div>
            <form th:action="@{/cart/add}" method="post" id="addToCartForm" data-cart-form>
                <input type="hidden" name="productId" th:value="${product.id}">
                <button type="submit" class="button wide" th:disabled="${(requiresVariant && !hasInStockVariants) || (!requiresVariant && (product.stockQuantity == null || product.stockQuantity <= 0))}"
                        th:text="${(requiresVariant && !hasInStockVariants) || (!requiresVariant && (product.stockQuantity == null || product.stockQuantity <= 0))} ? 'Нет в наличии' : 'Добавить в корзину'">Добавить в корзину</button>
            </form>
            <details class="specs">
                <summary>Характеристики</summary>
                <div class="specs-list">
                    <div class="spec-item" th:each="field : ${productFields}">
                        <span class="spec-label" th:text="${field.displayName}">Характеристика</span>
                        <span class="spec-value" th:text="${field.getValue(product) ?: 'Не указано'}">-</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Категория</span>
                        <span class="spec-value" th:text="${product.category != null ? product.category.name : 'Без категории'}">-</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Бренд</span>
                        <span class="spec-value" th:text="${product.brand != null ? product.brand.name : 'Неизвестен'}">-</span>
                    </div>
                </div>
            </details>
        </div>
    </section>
</main>
<script src="/js/telegram-shop.js"></script>
<script src="/js/cart-feedback.js"></script>
</body>
</html>
