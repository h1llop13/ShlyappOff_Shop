<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="navigation(active)" class="site-header">
    <div class="shell site-header-inner">
        <a class="wordmark" href="/">ShlyapOff<span aria-hidden="true">.</span></a>
        <nav class="site-nav" aria-label="Разделы магазина">
            <a href="/" th:attr="aria-current=${active == 'home' ? 'page' : null}">Главная</a>
            <a href="/catalog" th:attr="aria-current=${active == 'catalog' ? 'page' : null}">Каталог</a>
            <a href="/cart" th:attr="aria-current=${active == 'cart' ? 'page' : null}">Корзина</a>
            <a href="/profile" th:attr="aria-current=${active == 'profile' ? 'page' : null}">Профиль</a>
        </nav>
    </div>
</header>

<article th:fragment="productCard(product)" class="product-card">
    <a class="product-link" th:href="@{/product/{id}(id=${product.id})}">
        <img class="product-image" th:src="${product.imageThumbnailUrl ?: (product.imageUrl ?: '/img/placeholder.svg')}"
             alt="" width="400" height="400" loading="lazy" decoding="async">
        <h3 class="product-title" th:text="${product.name}">Название товара</h3>
    </a>
    <p class="product-price" th:text="${#numbers.formatDecimal(product.price, 1, 'WHITESPACE', 2, 'COMMA')} + ' ₽'">0 ₽</p>
    <a th:if="${product.requiresVariant}" class="button secondary product-action"
       th:href="@{/product/{id}(id=${product.id})}" th:attr="aria-label=|Выбрать вариант: ${product.name}|">Выбрать вариант</a>
    <form th:if="${!product.requiresVariant && product.stockQuantity != null && product.stockQuantity > 0}"
          th:action="@{/cart/add}" method="post" data-cart-form class="product-action">
        <input type="hidden" name="productId" th:value="${product.id}">
        <button type="submit" class="button secondary" th:attr="aria-label=|${product.name} — в корзину|">В корзину</button>
    </form>
    <p th:if="${!product.requiresVariant && (product.stockQuantity == null || product.stockQuantity <= 0)}"
       class="stock-status">Нет в наличии</p>
</article>
</body>
</html>
