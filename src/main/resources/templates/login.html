<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админку - ShlyapOff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-page">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card admin-surface">
                <div class="card-body">
                    <h1 class="h3 card-title mb-4">Вход в панель управления</h1>

                    <!-- Сообщение об ошибке, если логин/пароль неверные -->
                    <div th:if="${param.error}" class="alert alert-secondary admin-notice">
                        Неверный логин или пароль
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Логин</label>
                            <input type="text" class="form-control" id="username" name="username" autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Войти</button>
                    </form>
                    <a class="d-inline-block mt-3 link-dark" href="/">На сайт магазина</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
