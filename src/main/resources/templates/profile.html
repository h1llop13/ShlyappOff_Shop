<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Профиль · ShlyapOff</title>
    <link rel="stylesheet" href="/css/storefront.css">
    <script src="/js/telegram-loader.js" defer></script>
    <script src="/js/storefront.js" defer></script>
</head>
<body>
<header th:replace="~{fragments/store :: navigation('profile')}"></header>
<main class="shell">
    <h1 class="page-title">Профиль</h1>
    <div class="profile-layout">
        <section id="loyaltyCard" class="purchase-summary" aria-label="Бонусы" aria-live="polite">
            <p>Загружаем профиль…</p>
        </section>
        <section aria-labelledby="ordersTitle" id="ordersSection">
            <h2 id="ordersTitle">История заказов</h2>
            <div id="ordersList" aria-live="polite"><p>Загружаем заказы…</p></div>
        </section>
    </div>
</main>
<script>
    const loyaltyCard = document.getElementById('loyaltyCard');
    const ordersList = document.getElementById('ordersList');

    function formatMoney(n) {
        return new Intl.NumberFormat('ru-RU').format(n) + ' ₽';
    }

    function formatDate(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return d.toLocaleDateString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric' }) +
               ', ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    const STATUS_LABELS = {
        NEW: 'Новый', PROCESSING: 'В обработке', COMPLETED: 'Выполнен', CANCELLED: 'Отменён'
    };

    function renderLoyalty(loyalty) {
        const current = loyalty.currentBonusPercent || 0;
        const balance = loyalty.bonusBalance || 0;
        let progressHtml = '';

        if (loyalty.nextBonusPercent && loyalty.amountLeftToNextBonus != null) {
            // Грубая оценка прогресса к следующему порогу для прогресс-бара
            const left = Math.max(0, loyalty.amountLeftToNextBonus);
            const spent = loyalty.totalSpent;
            const target = spent + left;
            const pct = target > 0 ? Math.min(100, Math.round((spent / target) * 100)) : 0;
            progressHtml = `
                <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
                <div class="loyalty-hint">До кешбэка ${loyalty.nextBonusPercent}% осталось потратить ${formatMoney(left)}</div>
            `;
        } else {
            progressHtml = `<div class="loyalty-hint">У вас максимальный кешбэк по программе лояльности</div>`;
        }

        loyaltyCard.innerHTML = `
            <div class="loyalty-title">Доступно бонусов</div>
            <div class="loyalty-discount">${formatMoney(balance)}</div>
            <div class="loyalty-hint">Ваш кешбэк: <b>${current}%</b>. 1 бонус = 1 ₽</div>
            ${progressHtml}
        `;
    }

    function escapeText(value) {
        const node = document.createElement('span');
        node.textContent = value;
        return node.innerHTML;
    }

    function renderOrders(orders) {
        if (!orders.length) {
            ordersList.innerHTML = '<div class="empty-state">Заказов пока нет. <a href="/catalog">Перейти в каталог</a></div>';
            return;
        }

        ordersList.innerHTML = orders.map(order => {
            const itemsHtml = order.items.map(i =>
                `<div>${i.quantity} × ${escapeText(i.productName)}</div>`
            ).join('');

            const spent = order.bonusesSpent || 0;
            const earned = order.bonusesEarned || 0;
            const totalsHtml = spent > 0
                ? `<span class="order-subtotal-strike">${formatMoney(order.subtotalAmount)}</span>
                   <span class="order-total-final">${formatMoney(order.totalAmount)}</span>
                   <span class="order-discount-badge">−${formatMoney(spent)} бонусов</span>`
                : `<span class="order-total-final">${formatMoney(order.totalAmount)}</span>`;

            return `
                <div class="order-card">
                    <div class="order-card-header">
                        <span class="order-id">Заказ #${order.id}</span>
                        <span class="order-status">${escapeText(STATUS_LABELS[order.status] || order.status)}</span>
                    </div>
                    <div class="order-date">${formatDate(order.createdAt)}</div>
                    <div class="order-items">${itemsHtml}</div>
                    <div class="order-totals">${totalsHtml}${earned > 0 ? `<span class="order-discount-badge">+${formatMoney(earned)} бонусов</span>` : ''}</div>
                </div>
            `;
        }).join('');
    }

    function showError(message) {
        loyaltyCard.innerHTML = `<div class="empty-state">${message}</div>`;
        document.getElementById('ordersSection').hidden = true;
    }

    async function loadProfile(initData) {
        try {
            const res = await fetch('/api/profile/me', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData })
            });

            if (!res.ok) {
                showError('Не удалось загрузить профиль. Откройте магазин через кнопку в Telegram-боте.');
                return;
            }

            const data = await res.json();
            renderLoyalty(data.loyalty);
            document.getElementById('ordersSection').hidden = false;
            renderOrders(data.orders);
        } catch (e) {
            showError('Не удалось загрузить профиль. Попробуйте ещё раз.');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        window.TelegramLoader.onReady((tg) => {
            if (tg.initData) {
                loadProfile(tg.initData);
            } else {
                showError('Откройте магазин в Telegram, чтобы увидеть свой профиль и историю заказов.');
            }
        });
        window.TelegramLoader.onUnavailable(() => {
            showError('Откройте магазин в Telegram, чтобы увидеть свой профиль и историю заказов.');
        });
    });
</script>
</body>
</html>
