<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Корзина · ShlyapOff</title>
    <link rel="stylesheet" href="/css/storefront.css">
    <script src="/js/telegram-loader.js" defer></script>
    <script src="/js/storefront.js" defer></script>
</head>
<body data-bind-cart>
<header th:replace="~{fragments/store :: navigation('cart')}"></header>
<main class="shell">
    <div class="page-heading">
        <h1 class="page-title">Корзина</h1>
        <form th:if="${cart != null && !#lists.isEmpty(cart.items)}" th:action="@{/cart/clear}" method="post">
            <button type="submit" class="clear-btn" onclick="return confirm('Очистить корзину?')">Очистить</button>
        </form>
    </div>
    <p th:if="${error}" class="notice" role="alert" th:text="${error}"></p>
    <section th:if="${cart == null || #lists.isEmpty(cart.items)}" class="empty-state">
        <h2>Корзина пуста</h2>
        <a href="/catalog" class="button">Перейти в каталог</a>
    </section>
    <div class="purchase-layout" th:if="${cart != null && !#lists.isEmpty(cart.items)}">
        <div th:if="${cart != null && !#lists.isEmpty(cart.items)}" class="cart-list" aria-label="Товары в корзине">
            <div class="cart-item" th:each="item : ${cart.items}">
                <img th:if="${item.product.imageUrl != null}" th:src="${item.product.imageThumbnailUrl ?: item.product.imageUrl}" class="item-image" alt="" loading="lazy" decoding="async">
                <img th:if="${item.product.imageUrl == null}" src="/img/placeholder.svg" class="item-image" alt="" loading="lazy" decoding="async">

                <div class="item-info">
                    <div>
                        <h2 class="item-title"><a th:href="@{/product/{id}(id=${item.product.id})}" th:text="${item.product.name}">Товар</a></h2>
                        <p class="item-price-hint" th:text="${#numbers.formatDecimal(item.product.price, 1, 'WHITESPACE', 2, 'COMMA')} + ' ₽ / шт'">0 ₽ / шт</p>
                    </div>

                    <p th:if="${item.productVariant != null}" class="item-price-hint"
                       th:text="${item.productVariant.value}">Вариант</p>
                    <div class="qty-control">
                        <button th:if="${item.quantity <= 1}" type="button" class="qty-btn" disabled aria-label="Уменьшить количество">−</button>
                        <form th:if="${item.quantity > 1}" th:action="@{/cart/update}" method="post" class="qty-form">
                            <input type="hidden" name="productId" th:value="${item.product.id}">
                            <input th:if="${item.productVariant != null}" type="hidden" name="variantId" th:value="${item.productVariant.id}">
                            <button type="submit" name="quantity" th:value="${item.quantity - 1}" class="qty-btn" aria-label="Уменьшить количество">−</button>
                        </form>

                        <span class="qty-value" th:text="${item.quantity}">1</span>

                        <form th:action="@{/cart/update}" method="post" class="qty-form">
                            <input type="hidden" name="productId" th:value="${item.product.id}">
                            <input th:if="${item.productVariant != null}" type="hidden" name="variantId" th:value="${item.productVariant.id}">
                            <button type="submit" name="quantity" th:value="${item.quantity + 1}" class="qty-btn" aria-label="Увеличить количество">+</button>
                        </form>
                    </div>
                </div>

                <div class="item-actions">
                    <form th:action="@{/cart/remove}" method="post" class="delete-form">
                        <input type="hidden" name="productId" th:value="${item.product.id}">
                        <input th:if="${item.productVariant != null}" type="hidden" name="variantId" th:value="${item.productVariant.id}">
                        <button type="submit" class="delete-btn" th:attr="aria-label=|Удалить ${item.product.name}|">Удалить</button>
                    </form>
                    <div class="item-total" th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 1, 'WHITESPACE', 2, 'COMMA')} + ' ₽'">0 ₽</div>
                </div>
            </div>
        </div>
        <aside class="purchase-summary">
            <h2>Ваш заказ</h2>
            <div class="total-row">
                <span>Итого</span>
                <strong th:text="${#numbers.formatDecimal(total, 1, 'WHITESPACE', 2, 'COMMA')} + ' ₽'">0 ₽</strong>
            </div>
            <a href="/checkout" class="button wide">Оформить заказ</a>
        </aside>
    </div>
</main>
<script src="/js/telegram-shop.js"></script>
</body>
</html>
