<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Каталог · ShlyapOff</title>
    <link rel="stylesheet" href="/css/storefront.css">
    <script src="/js/telegram-loader.js" defer></script>
    <script src="/js/storefront.js" defer></script>
</head>
<body>
<header th:replace="~{fragments/store :: navigation('catalog')}"></header>
<main class="shell">
    <h1 class="page-title">Каталог</h1>
    <form th:action="@{/catalog}" method="get" class="catalog-search" role="search" aria-label="Поиск и фильтры">
        <div class="search-row">
            <input type="search" name="search" aria-label="Поиск товаров" placeholder="Поиск по названию" th:value="${search}">
            <button class="button" type="submit">Найти</button>
        </div>
        <details class="filters" th:open="${categoryId != null || brandId != null || minPrice != null || maxPrice != null || onlyInStock || (sort != null && sort != 'newest')}">
            <summary>Фильтры и сортировка</summary>
            <div class="filters-panel">
                <div class="filter-row">
                    <select name="categoryId" class="filter-select" aria-label="Категория">
                        <option value="">Все категории</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                th:selected="${cat.id == categoryId}"></option>
                    </select>
                    <select name="brandId" class="filter-select" aria-label="Бренд">
                        <option value="">Все бренды</option>
                        <option th:each="br : ${brands}" th:value="${br.id}" th:text="${br.name}"
                                th:selected="${br.id == brandId}"></option>
                    </select>
                    <select name="sort" class="filter-select" aria-label="Сортировка">
                        <option value="newest" th:selected="${sort == 'newest'}">Сначала новые</option>
                        <option value="price_asc" th:selected="${sort == 'price_asc'}">Сначала дешевле</option>
                        <option value="price_desc" th:selected="${sort == 'price_desc'}">Сначала дороже</option>
                    </select>
                </div>
                <div class="price-row">
                    <input class="filter-input" type="number" min="0" step="1" name="minPrice" aria-label="Минимальная цена" placeholder="Цена от" th:value="${minPrice}">
                    <input class="filter-input" type="number" min="0" step="1" name="maxPrice" aria-label="Максимальная цена" placeholder="Цена до" th:value="${maxPrice}">
                </div>
                <div class="filter-actions">
                    <label class="stock-toggle"><input type="checkbox" name="onlyInStock" value="true" th:checked="${onlyInStock}"> Только в наличии</label>
                    <div><a href="/catalog" class="clear-filters">Сбросить</a><button type="submit" class="button">Применить</button></div>
                </div>
            </div>
        </details>
    </form>

    <section th:if="${#lists.isEmpty(products)}" class="empty-state">
        <h2>Товары не найдены</h2>
        <p>Попробуйте изменить запрос или сбросить фильтры.</p>
        <a href="/catalog" class="button secondary">Сбросить фильтры</a>
    </section>
    <div class="products-grid" th:unless="${#lists.isEmpty(products)}">
        <th:block th:each="product : ${products}">
            <article th:replace="~{fragments/store :: productCard(${product})}"></article>
        </th:block>
    </div>
    <div th:if="${currentPage > 0 || hasNextPage}" class="pagination">
        <a th:if="${currentPage > 0}"
           th:href="@{/catalog(page=${currentPage - 1}, search=${search}, categoryId=${categoryId}, brandId=${brandId}, minPrice=${minPrice}, maxPrice=${maxPrice}, onlyInStock=${onlyInStock}, sort=${sort})}"
           class="page-btn">← Назад</a>

        <span class="page-btn active" th:text="${currentPage + 1}">1</span>

        <a th:if="${hasNextPage}"
           th:href="@{/catalog(page=${currentPage + 1}, search=${search}, categoryId=${categoryId}, brandId=${brandId}, minPrice=${minPrice}, maxPrice=${maxPrice}, onlyInStock=${onlyInStock}, sort=${sort})}"
           class="page-btn">Вперёд →</a>
    </div>
</main>
<script src="/js/telegram-shop.js"></script>
<script src="/js/cart-feedback.js"></script>
</body>
</html>
